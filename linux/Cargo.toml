[package]
name = "rewindd"
version = "0.1.0"
edition = "2024"
description = "Wayland capture daemon for Rewind"

[lib]
name = "rewindd"
path = "src/lib.rs"

[[bin]]
name = "rewindd"
path = "src/bin/rewindd.rs"

[[bin]]
name = "rewind"
path = "src/bin/rewind.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Capture, H.264 encode and decode all go through one pipeline: pipewiresrc
# takes the portal's node, the video processor converts DMA-BUFs for the
# hardware encoder, and appsink hands out access units.
gstreamer = "0.25"
gstreamer-app = "0.25"

# The portal, not the compositor, is what grants screen capture on Wayland.
ashpd = "0.12"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync"] }

image = { version = "0.25", default-features = false, features = ["png", "gif"] }
libc = "0.2"
