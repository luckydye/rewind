name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The bundle copies resources/Info.plist, so stamp the tag in before
      # building: v1.4.2 becomes CFBundleShortVersionString 1.4.2.
      - name: Stamp the version into the bundle
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" resources/Info.plist

      # make bundle builds rewind-ui and rewindd in release, assembles
      # dist/Rewind.app, signs it ad-hoc (no local identity on CI) and fails
      # the job if signing fails.
      - name: Build the app bundle
        run: make bundle

      - name: Archive the app
        run: |
          ditto -c -k --keepParent dist/Rewind.app "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip"
          shasum -a 256 "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip" \
            > "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rewind-macos-arm64
          path: dist/Rewind-*.zip*

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The same bundle path used locally: win + ui in release, all four
      # executables copied into dist\Rewind.
      - name: Build the bundle
        run: ./scripts/windows.ps1 bundle

      - name: Archive the bundle
        shell: pwsh
        run: |
          $zip = "dist/Rewind-$env:GITHUB_REF_NAME-windows-x64.zip"
          Compress-Archive -Path dist/Rewind -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: rewind-windows-x64
          path: dist/Rewind-*.zip*

  # One job publishes both builds, so the two platforms never race to create
  # the release. Re-running a tag build replaces the assets.
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
