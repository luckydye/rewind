name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The bundle copies resources/Info.plist, so stamp the tag in before
      # building: v1.4.2 becomes CFBundleShortVersionString 1.4.2.
      - name: Stamp the version into the bundle
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" resources/Info.plist

      # make bundle builds rewind-ui and rewindd in release, assembles
      # dist/Rewind.app, signs it ad-hoc (no local identity on CI) and fails
      # the job if signing fails.
      - name: Build the app bundle
        run: make bundle

      - name: Archive the app
        run: |
          ditto -c -k --keepParent dist/Rewind.app "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip"
          shasum -a 256 "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip" \
            > "dist/Rewind-${GITHUB_REF_NAME}-macos-arm64.zip.sha256"

      # Re-running a tag build uploads over the existing assets instead of
      # failing on an already-published release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/Rewind-*.zip dist/Rewind-*.zip.sha256 --clobber
