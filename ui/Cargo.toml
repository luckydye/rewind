[package]
name = "rewind-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rewind-ui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The window handle (raw-window-handle, as GPUI exposes it) and the Win32
# calls GPUI does not make: borderless topmost window, foreground, capture
# exclusion, and the named event the daemon wakes the overlay with.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
